services:
  - type: web
    name: alejo-motors-static-preview
    runtime: static
    branch: codex/render-static-preview
    buildCommand: "pnpm install --frozen-lockfile && pnpm run build"
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    previews:
      generation: automatic
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: CONTACT_PHONE
        value: "+16789271739"
      - key: PUBLIC_INVENTORY_ENDPOINT
        sync: false
      - key: PUBLIC_LEAD_ENDPOINT
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=60, stale-while-revalidate=86400
    routes:
      - type: rewrite
        source: /detail
        destination: /detail.html
      - type: rewrite
        source: /vehicle
        destination: /detail.html
